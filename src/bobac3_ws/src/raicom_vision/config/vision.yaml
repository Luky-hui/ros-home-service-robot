model_path: /home/robot/ros_workspace/models/raicom_service_yolo_texture.pt
default_image_topic: /head_camera/image_raw
service_name: /raicom_vision/detect
annotated_topic: /raicom_vision/annotated
detections_topic: /raicom_vision/detections
image_timeout: 5.0
image_size: 640
iou: 0.5
default_confidence: 0.25
classes:
  - fire
  - fire_extinguisher
chinese_names:
  fire: 火源
  fire_extinguisher: 灭火器
template_match:
  enabled: true
  directory: /home/robot/ros_workspace/models/home_food_templates
  threshold: 0.75
  scales: [0.45, 0.60, 0.75, 0.90, 1.00, 1.15, 1.30, 1.50]
  labels:
    - 上海青
    - 土豆
    - 猪肉
    - 玉米
    - 番茄
    - 苹果
    - 茄子
    - 虾
    - 豆腐
    - 青椒
    - 香蕉
    - 鱼肉
    - 鸡蛋
    - 黄瓜
debug_image_directory: /tmp/raicom_vision_debug
