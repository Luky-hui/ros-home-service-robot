missions:
  welcome:
    target: shenzhen
    return_target: start
    trigger_phrase: "馆"
    greeting: "你好，欢迎您的到来！有什么需要帮助的吗？"
    accept: "好的，请跟我来。"
    introduction: "深圳，是广东副省级市、经济特区。毗邻香港，经济发达，创新力强，有众多世界500强企业，是粤港澳大湾区中心城市。"
    leaving: "这里就是深圳馆啦，我要继续回去工作啦！"
    introductions:
      shenzhen: "深圳馆传承传统工艺，挖掘本土技艺，保护岭南地区珍贵非物质文化遗产。"
      guangzhou: "广州馆彰显羊城古韵，传承岭南文脉，展现千年商都传承发展新风貌。"
      beijing: "北京馆发展会展经济，汇聚八方宾客，提升首都国际交流知名度。"
      shanghai: "上海馆深化文明创建，提升市民素养，树立国际化都市文明新标杆。"
      jilin: "吉林馆打造乡土雕塑，融入林海元素，提升北方城镇公共艺术整体品位。"
    leavings:
      shenzhen: "这里就是深圳馆啦，我要继续回去工作啦！"
      guangzhou: "这里就是广州馆啦，我要继续回去工作啦！"
      beijing: "这里就是北京馆啦，我要继续回去工作啦！"
      shanghai: "这里就是上海馆啦，我要继续回去工作啦！"
      jilin: "这里就是吉林馆啦，我要继续回去工作啦！"
  patrol:
    trigger_phrase: "巡检"
    admin_name: "operator"
    accept: "好的，进入巡检模式"
    route: [beijing, guangzhou, jilin, shanghai, shenzhen]
    charge_approach_target: charge_approach
    charge_target: charge

inspection:
  prepare_visible_event: false
  event_source: vision
  image_topic: /berxel_base/color/image_raw
  settle_time: 1.0
  alarm_seconds: 4.0
  sample_count: 2
  sample_interval: 0.15
  fire_confidence: 0.30
  extinguisher_confidence: 0.80
  texture_diff_enabled: false
  texture_baseline_dir: /home/robot/bobac3_ws/src/service_group_mission/assets/service_baselines
  texture_current_template: /home/robot/.gazebo/models/rei_2025raicom/{venue}/meshes/{venue}.png
  texture_diff_pixel_threshold: 35
  fire_diff_roi: [0.12, 0.52, 0.50, 0.98]
  extinguisher_diff_roi: [0.62, 0.48, 0.92, 0.98]
  fire_diff_ratio_threshold: 0.015
  extinguisher_diff_ratio_threshold: 0.010
  template_match_enabled: false
  template_fire_path: /home/robot/.gazebo/models/rei_2025raicom/fire_hazard/meshes/fire_hazard.png
  template_extinguisher_path: /home/robot/.gazebo/models/rei_2025raicom/fire_extinguisher/meshes/fire_extinguisher.png
  template_threshold: 0.42
  template_scales: [0.12, 0.16, 0.20, 0.25, 0.32, 0.40, 0.50]
  color_event_enabled: false
  fire_orange_ratio_threshold: 0.035
  extinguisher_red_ratio_threshold: 0.006
  gazebo_event_fallback: true
  scripted_events: {}

inspection_pose_adjustment:
  enabled: false
  venues: [beijing, guangzhou, jilin, shanghai, shenzhen]
  speech: "到达点位"
  reverse_distance: 0.10
  reverse_speed: -0.05
  settle_after_reverse: 0.3

arrival_observation:
  enabled: false
  speech: "到达点位"
  pause: 0.0

navigation_failure_recovery:
  enabled: true
  retry_count: 1
  retry_nav_timeout: 45.0
  motions:
    - linear_x: 0.05
      linear_y: 0.0
      angular_z: 0.0
      duration: 2.0

precision_parking:
  enabled: true
  default:
    xy_tolerance: 0.015
    yaw_tolerance: 0.035
    timeout: 18.0
    rate: 20.0
    stable_cycles: 8
    kp_xy: 0.7
    kp_yaw: 0.9
    max_linear: 0.055
    max_angular: 0.18
  start:
    xy_tolerance: 0.020
    timeout: 30.0
    stable_cycles: 8
  charge:
    xy_tolerance: 0.020
    yaw_tolerance: 0.025
    timeout: 25.0
    stable_cycles: 8
    kp_xy: 0.55
    kp_yaw: 0.7
    max_linear: 0.035
    max_angular: 0.10
  charge_approach:
    xy_tolerance: 0.020
