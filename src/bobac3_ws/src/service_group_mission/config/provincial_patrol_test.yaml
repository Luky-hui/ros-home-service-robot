missions:
  welcome:
    target: shenzhen
    return_target: start
    trigger_phrase: "可以带我去参观一下深圳馆吗"
    greeting: "你好，欢迎您的到来！有什么需要帮助的吗？"
    accept: "好的，请跟我来。"
    introduction: "深圳，是广东副省级市、经济特区。"
    leaving: "这里就是深圳馆啦，我要继续回去工作啦！"
  patrol:
    trigger_phrase: "开始执行巡检任务"
    admin_name: "operator"
    accept: "好的，进入巡检模式"
    route: [jilin, guangzhou, beijing, shanghai, shenzhen]
    charge_approach_target: charge_approach
    charge_target: charge

inspection:
  event_source: scripted
  image_topic: /head_camera/image_raw
  settle_time: 0.2
  alarm_seconds: 4.0
  sample_count: 3
  sample_interval: 0.3
  fire_confidence: 0.10
  extinguisher_confidence: 0.10
  scripted_events:
    jilin: fire
    guangzhou: normal
    beijing: extinguisher_missing
    shanghai: normal
    shenzhen: normal

arrival_observation:
  enabled: false
  speech: "到达点位"
  pause: 0.0

precision_parking:
  enabled: true
  default:
    xy_tolerance: 0.025
    yaw_tolerance: 0.05
    timeout: 12.0
    rate: 20.0
    stable_cycles: 10
    kp_xy: 0.7
    kp_yaw: 0.9
    max_linear: 0.05
    max_angular: 0.12
  charge:
    xy_tolerance: 0.020
    yaw_tolerance: 0.025
    timeout: 25.0
    stable_cycles: 15
    kp_xy: 0.45
    kp_yaw: 0.7
    max_linear: 0.025
    max_angular: 0.08
  shenzhen:
    timeout: 30.0
    max_angular: 0.22
  shanghai:
    timeout: 30.0
    max_angular: 0.22
  beijing:
    xy_tolerance: 0.060
    timeout: 30.0
    stable_cycles: 4
    max_angular: 0.22
  guangzhou:
    timeout: 30.0
    max_angular: 0.22
  jilin:
    timeout: 30.0
    max_angular: 0.22

exit_after_parking:
  enabled: true
  venues: [jilin, guangzhou, beijing, shanghai, shenzhen]
  reverse_speed: -0.06
  duration: 4.5

docking:
  enabled: true
  reverse_speed: -0.025
  timeout: 18.0
  y_tolerance: 0.025
  yaw_tolerance: 0.035
  kp_yaw: 0.6
  max_angular: 0.06
